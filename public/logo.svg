<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a2a"/>
      <stop offset="1" stop-color="#c91018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9c85f"/>
      <stop offset="1" stop-color="#c68a26"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <g transform="translate(40 55)">
    <path d="M150 0 L285 52 L265 230 Q245 330 150 382 Q55 330 35 230 L15 52 Z"
          fill="none" stroke="url(#red)" stroke-width="22" stroke-linejoin="round"/>

    <!-- Rocket -->
    <g transform="translate(85 80) rotate(14 65 110)">
      <polygon points="65,0 105,62 25,62" fill="url(#red)"/>
      <rect x="38" y="58" width="54" height="155" rx="8" fill="#f4f4f4" stroke="#151515" stroke-width="8"/>
      <polygon points="38,92 92,72 92,106 38,126" fill="#df1d28"/>
      <polygon points="38,138 92,118 92,152 38,172" fill="#df1d28"/>
      <polygon points="38,184 92,164 92,198 38,213" fill="#df1d28"/>
      <rect x="56" y="213" width="18" height="74" rx="7" fill="url(#gold)"/>
    </g>

    <!-- Spark -->
    <g transform="translate(212 250)">
      <path d="M0 -28 L7 -8 L28 -15 L12 0 L28 15 L7 8 L0 28 L-7 8 L-28 15 L-12 0 L-28 -15 L-7 -8 Z"
            fill="url(#gold)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(390 125)">
    <text x="0" y="82" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="2" fill="#ffffff">MERCUN</text>
    <text x="0" y="194" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="2" fill="#e31b23">BERLESEN</text>
    <text x="3" y="258" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" letter-spacing="8" fill="#ffffff">LICENSED FIREWORKS SUPPLIER</text>
    <line x1="3" y1="302" x2="170" y2="302" stroke="#9d9d9d" stroke-width="2"/>
    <text x="210" y="314" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" letter-spacing="12" fill="#ffffff">MALAYSIA</text>
    <line x1="520" y1="302" x2="710" y2="302" stroke="#9d9d9d" stroke-width="2"/>
  </g>
</svg>